<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Car Dodger</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="hud">
      <div id="score">Score: 0</div>
      <div id="help">A / D or ← / → to switch lanes</div>
    </div>

    <div id="game-over" class="hidden">
      <h1>Crash!</h1>
      <p id="final-score">Score: 0</p>
      <button id="restart-btn" type="button">Play Again</button>
      <p class="hint">Press Enter to restart</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.min.js"></script>
    <script src="./game.js"></script>
  </body>
</html>
